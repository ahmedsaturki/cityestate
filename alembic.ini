# Alembic Configuration File
# ===========================
# CityEstate Database Migrations

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# sys.path for import (relative to this file)
prepend_sys_path = .

# sqlalchemy.url - can be overridden by env vars
# For SQLite: sqlite:///output/cityestate.db
# For PostgreSQL: postgresql://user:pass@localhost:5432/cityestate
sqlalchemy.url = sqlite:///output/cityestate.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
